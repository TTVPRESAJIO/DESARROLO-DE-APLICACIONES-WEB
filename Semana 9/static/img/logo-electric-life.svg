<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190" role="img" aria-label="Electric Life Solar">
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdb913"/>
      <stop offset="0.55" stop-color="#f7941e"/>
      <stop offset="1" stop-color="#ef6c00"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f86d0"/>
      <stop offset="1" stop-color="#134a86"/>
    </linearGradient>
    <linearGradient id="panelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5fa0"/>
      <stop offset="1" stop-color="#0e3767"/>
    </linearGradient>
  </defs>

  <!-- ===== SOL (rayos + disco naciente) ===== -->
  <g>
    <!-- Rayos -->
    <g fill="url(#sol)">
      <g transform="translate(103,74)">
        <g>
          <polygon points="-6,-64 6,-64 0,-40"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(30)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(60)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(90)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(-30)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(-60)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(-90)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(-120)"/>
          <polygon points="-6,-64 6,-64 0,-40" transform="rotate(120)"/>
        </g>
      </g>
    </g>
    <!-- Disco del sol -->
    <circle cx="103" cy="74" r="33" fill="url(#sol)"/>
    <circle cx="103" cy="74" r="33" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- ===== PANELES SOLARES (rejilla en perspectiva) ===== -->
  <g transform="translate(60,96) skewX(-24)">
    <!-- fila 1 -->
    <rect x="0"  y="0"  width="30" height="18" rx="1.5" fill="url(#panel)"     stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="33" y="0"  width="30" height="18" rx="1.5" fill="url(#panelDark)" stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="66" y="0"  width="30" height="18" rx="1.5" fill="url(#panel)"     stroke="#bfe0f7" stroke-width="1.2"/>
    <!-- fila 2 -->
    <rect x="0"  y="21" width="30" height="18" rx="1.5" fill="url(#panelDark)" stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="33" y="21" width="30" height="18" rx="1.5" fill="url(#panel)"     stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="66" y="21" width="30" height="18" rx="1.5" fill="url(#panelDark)" stroke="#bfe0f7" stroke-width="1.2"/>
    <!-- fila 3 -->
    <rect x="0"  y="42" width="30" height="18" rx="1.5" fill="url(#panel)"     stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="33" y="42" width="30" height="18" rx="1.5" fill="url(#panelDark)" stroke="#bfe0f7" stroke-width="1.2"/>
    <rect x="66" y="42" width="30" height="18" rx="1.5" fill="url(#panel)"     stroke="#bfe0f7" stroke-width="1.2"/>
  </g>

  <!-- ===== TEXTO ===== -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-style="italic" font-weight="800">
    <text x="188" y="86" font-size="52" fill="#17427f">Electric</text>
    <text x="368" y="86" font-size="52" fill="#f47b20">Life</text>
  </g>

  <!-- ===== SOLAR + líneas ===== -->
  <g>
    <line x1="190" y1="120" x2="300" y2="120" stroke="#5aa63c" stroke-width="4" stroke-linecap="round"/>
    <text x="352" y="130" font-family="'Segoe UI', Arial, sans-serif" font-weight="700"
          font-size="26" letter-spacing="8" fill="#5aa63c" text-anchor="middle">SOLAR</text>
    <line x1="404" y1="120" x2="470" y2="120" stroke="#5aa63c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
